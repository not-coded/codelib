plugins {
	//id("dev.kikugie.stonecutter")
	id("fabric-loom") version "1.8.12"
	id('net.ltgt.errorprone') version "4.1.0"
	id("maven-publish")
}

archivesBaseName = property("mod.name")
version = "${property("mod.version")}" + "+" + "${property("mod.version_name")}"
group = property("mod.maven_group")

base {
	archivesName = archivesBaseName
}

dependencies {
	minecraft "com.mojang:minecraft:${property('deps.minecraft')}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"
	errorprone implementation("com.google.errorprone:error_prone_core:${property('deps.errorprone')}")
}

loom {
	runConfigs.configureEach {
		ideConfigGenerated true // Run configurations are not created for subprojects by default
		runDir "../../run" // Use a shared run folder and just create separate worlds
	}
}

def target = ">=${property("mod.min_target")}- <=${property("mod.max_target")}"

processResources {
	def expandProps = [
			'version': project.version,
			"minecraftVersion": target,
			"javaVersion": project.property("deps.java")
	]

	filesMatching('fabric.mod.json') {
		expand expandProps
	}

	inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'

	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.getRelease().set(project.property("deps.java") as Integer)

	// Fixes Error Prone INIT policy
	it.options.compilerArgs << '--should-stop=ifError=FLOW'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	withJavadocJar()

	def java = property("deps.java") == "8" ? JavaVersion.VERSION_1_8 : JavaVersion.VERSION_17

	sourceCompatibility = java
	targetCompatibility = java
}


jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

def collectJars = tasks.register("collectJars", Copy) { copy ->

	def task = tasks.named("remapJar")

	dependsOn(task)

	copy.from task
	copy.into rootProject.buildDir.path + "/libs"
}

// Set up assemble to depend on the collectJars task, so it gets run on build.
assemble {
	dependsOn(collectJars)
}

if (stonecutter.current.isActive) {
	loom {
		runConfigs.client {
			ideConfigGenerated = true
			vmArgs "-Dmixin.debug.export=true"
			runDir "../../run"
		}
	}

	rootProject.tasks.register("buildActive") {
		setGroup "project"

		dependsOn tasks.named("build")
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
		gpr(MavenPublication) {
			from components.java
		}
	}

	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/not-coded/codelib")
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
				password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
			}
		}
	}
}

